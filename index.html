<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Честняков — Библиотека</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">ЧЕСТНЯКОВ<span>.</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="searchToggle" aria-label="Поиск">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Сменить тему">
        <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
      <nav class="nav">
        <a href="#sections">Разделы</a>
        <a href="#catalog">Каталог</a>
      </nav>
    </div>
  </header>

  <!-- ПАНЕЛЬ ПОИСКА -->
  <div class="search-panel" id="searchPanel">
    <div class="search-panel-inner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search" placeholder="Поиск по названию, описанию, тегу...">
      <button class="search-close" id="searchClose" aria-label="Закрыть поиск">×</button>
    </div>
  </div>

  <!-- БАННЕР-КАРУСЕЛЬ В СТИЛЕ ОККО -->
  <section class="hero-carousel" id="sections">
    <div class="slides" id="slides"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content" id="heroContent">
      <p class="hero-tag" id="heroTag"></p>
      <h1 id="heroTitle"></h1>
      <p class="hero-desc" id="heroDesc"></p>
      <button class="btn" id="heroBtn">Открыть раздел</button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <!-- МИНИ-БИБЛИОТЕКА РАЗДЕЛА (скрыта по умолчанию) -->
  <section class="section-view" id="sectionView">
    <div class="section-view-inner">
      <button class="back-btn" id="backBtn">← Назад к баннерам</button>
      <h2 id="svTitle"></h2>
      <p class="sv-desc" id="svDesc"></p>
      <div class="subsection-list" id="subsectionList"></div>
    </div>
  </section>

  <!-- КАТАЛОГ (общий) -->
  <section class="filters" id="catalog">
    <div class="filters-inner">
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <main class="catalog">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">Ничего не найдено. Попробуйте другой запрос.</p>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>Библиотека материалов о Ефиме Васильевиче Честнякове (1874–1961).</p>
    <p class="muted">Собрано из открытых источников. GitHub Pages.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
